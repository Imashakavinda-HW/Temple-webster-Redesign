# One-off: downloads free product photos (this sandbox can't reach the photo sites),
# optimises them with `npm run photos`, and commits the result. Removed once done.
name: Fetch product photos (one-off)
on:
  push:
    branches: [claude/inspiring-archimedes-a0zfrq]
    paths: ['.github/photo-fetch/**', '.github/workflows/fetch-photos.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-photos
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node .github/photo-fetch/fetch.mjs
      - run: npm run photos
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/images docs/IMAGE-CREDITS.md photo-previews
          git commit -m "Add free product photos (fetched and optimised by GitHub Actions)" || { echo "Nothing to commit"; exit 0; }
          git push origin "HEAD:${GITHUB_REF_NAME}"
